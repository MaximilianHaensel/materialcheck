<header class="top no-print"><div class="brand">Sanitätsdienst Materialcheck</div><div class="top-actions"><button id="homeButton">Übersicht</button><button id="finishButton" class="hidden" onclick="openFinish()">Check abschließen</button><button id="cancelButton" class="hidden" onclick="cancelCheck()">Check abbrechen</button></div></header>
<div id="storageError" class="storage-error hidden" role="alert"></div><main id="app" class="wrap"></main><dialog id="dialog"></dialog>
<input id="importFile" type="file" accept="application/json,.json" hidden>

<script id="catalog" type="application/json">{}</script>
<script>
(async()=>{
  const fail=(msg)=>{document.getElementById('app').innerHTML='<section class="card"><h1>App konnte nicht gestartet werden</h1><p>'+msg+'</p></section>'};
  try{
    const reg=await fetch('./checklisten/index.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('Checklisten-Verzeichnis');return r.json()});
    const lists=await Promise.all(reg.checklists.map(x=>fetch('./checklisten/'+x.file,{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(x.file);return r.json()})));
    const merged={version:Math.max(...lists.map(x=>x.version||0)),containers:lists.flatMap(x=>x.containers||[]),groups:lists.flatMap(x=>x.groups||[])};
    document.getElementById('catalog').textContent=JSON.stringify(merged);
    for(const src of ['./pdf-report.js','./app.js']){
      await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.body.appendChild(s)});
    }
    if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  }catch(e){fail('Die Checklisten oder Programmdateien konnten nicht geladen werden. Bitte die PWA über HTTPS bzw. localhost öffnen.');}
})();
</script>
