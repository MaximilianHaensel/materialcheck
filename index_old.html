<script>
'use strict';
const DATA=JSON.parse(document.getElementById('catalog').textContent),GROUPS=DATA.groups,ITEMS=GROUPS.flatMap(g=>g.items.map(i=>({...i,group:g}))),BYID=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const NODES=Object.fromEntries([...DATA.containers,...GROUPS,...ITEMS].map(n=>[n.id,n]));
function ancestry(node){const result=[];const seen=new Set();while(node){if(seen.has(node.id))throw Error('Zyklische Zuordnung');seen.add(node.id);result.unshift(node);node=node.parent===null?null:NODES[node.parent];}return result}
function groupLabel(g){return ancestry(g).slice(1).map(n=>n.name).join(' / ')}
const KEY='aa-nef-materialcheck-v1',app=document.getElementById('app'),dlg=document.getElementById('dialog');
let db={schema:1,active:null,sessions:[]},screen='home',mode='check',groupId=GROUPS[0].id,query='',filter='all',storageOK=true;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString(),fmt=x=>x?new Date(x).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'–';
function storageFail(t){storageOK=false;const el=document.getElementById('storageError');el.classList.remove('hidden');el.textContent=t+' Bitte eine Sicherung herunterladen. Änderungen bleiben sonst nur bis zum Schließen dieser Seite erhalten.'}
function validDB(d){if(!d||d.schema!==1||!Array.isArray(d.sessions)||d.sessions.length>300)return false;const ids=new Set();for(const s of d.sessions){if(!s||typeof s.id!=='string'||ids.has(s.id)||!Number.isFinite(Date.parse(s.started))||typeof s.name!=='string'||typeof s.secondName!=='string'||!s.entries||typeof s.entries!=='object'||!Array.isArray(s.strokes)||s.strokes.length>10000||!(typeof s.scope==='string'&&['all','amp','bag','san','root'].includes(s.scope)))return false;ids.add(s.id);if(s.finished&&!Number.isFinite(Date.parse(s.finished)))return false;if(s.generalNote!==undefined&&(typeof s.generalNote!=='string'||s.generalNote.length>6000))return false;for(const [id,e] of Object.entries(s.entries)){if(!BYID[id]||!e||![null,'ok','partial','absent'].includes(e.status)||!Number.isSafeInteger(e.missing)||e.missing<0||!Number.isSafeInteger(e.used)||e.used<0||(e.refilled!==undefined&&(!Number.isSafeInteger(e.refilled)||e.refilled<0))||(e.defect!==undefined&&typeof e.defect!=='boolean')||typeof e.checkNote!=='string'||typeof e.useNote!=='string')return false;if(BYID[id].qty!==null&&e.missing>BYID[id].qty&&!BYID[id].userOverride)return false;}for(const stroke of s.strokes){if(!Array.isArray(stroke)||stroke.length>100000)return false;for(const pt of stroke)if(!Array.isArray(pt)||pt.length!==2||pt.some(n=>!Number.isFinite(n)||n<0||n>1))return false;}}return d.active===null||ids.has(d.active)}
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!validDB(parsed))throw Error('invalid');db=parsed;}}catch(e){storageFail('Der lokale Speicher konnte nicht gelesen werden. Bestehende Daten werden nicht überschrieben.');}
function save(){if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(db));document.querySelectorAll('[data-saved]').forEach(x=>x.textContent='Lokal gespeichert · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));}catch(e){storageFail('Lokales Speichern ist in diesem Browser nicht möglich oder der Speicher ist voll.')}}
function session(){return db.sessions.find(s=>s.id===db.active)}
function entry(id){const s=session();let e=s.entries[id];if(!e)e=s.entries[id]={status:null,missing:0,used:0,refilled:0,defect:false,checkNote:'',useNote:''};if(e.refilled===undefined)e.refilled=0;if(e.defect===undefined)e.defect=false;return e}
function sessionRoot(s=session()){if(s?.rootId&&NODES[s.rootId])return s.rootId;if(s?.scope==='san')return'san-rucksack-kv';return'aa-nef'}
function sessionSelected(s=session()){if(Array.isArray(s?.selectedIds)&&s.selectedIds.length)return s.selectedIds.filter(id=>NODES[id]);if(s?.scope==='amp')return['amp'];if(s?.scope==='bag')return['rucksack'];if(s?.scope==='all')return['rucksack','amp'];return[]}
function selectableChildren(rootId){return [...DATA.containers,...GROUPS].filter(c=>c.parent===rootId&&c.selectable===true)}
function inScope(g){const s=session(),root=sessionRoot(s),selected=sessionSelected(s);const chain=ancestry(g);if(!chain.some(n=>n.id===root))return false;return selected.length?selected.some(id=>chain.some(n=>n.id===id)):true}
function scopeLabel(s){const root=NODES[sessionRoot(s)];const selected=sessionSelected(s);if(!selected.length)return root?.name||'–';return selected.map(id=>NODES[id]?.name).filter(Boolean).join(' + ')}
function path(g){return ancestry(g).map(n=>n.name).join(' > ')}
function sourceLabel(g){return g.id==='amp'||g.document==='amp'?'Arzt-Ampullarium · V2.1 · 12.01.2026 · Seiten 1–2':g.document==='san'?'SAN-Rucksack PAX · V1.7 · 26.07.2025 · Seite '+g.page:g.document==='mpg'?'MPG/Sonstiges': 'Notfallrucksack groß · V1.1 · 25.09.2023 · Seite '+g.page}
function stats(){const a=scoped();return {total:a.length,done:a.filter(i=>entry(i.id).status!==null).length,missing:a.filter(i=>finalMissing(i,entry(i.id))>0||entry(i.id).status==='absent').length,used:a.filter(i=>entry(i.id).used>0).length,refilled:a.filter(i=>entry(i.id).refilled>0).length,defects:a.filter(i=>entry(i.id).defect).length,unclear:a.filter(i=>i.note).length}}
function openDialog(html){dlg.innerHTML=html;dlg.showModal()}
function home(){screen='home';render()}
function startForm(){const rootId=document.getElementById('vehicleSelect')?.value||DATA.containers.find(c=>c.parent===null)?.id,root=NODES[rootId],choices=selectableChildren(rootId);const choiceHtml=choices.length?`<fieldset class="object-selection"><legend>Was möchtest du prüfen?</legend>${choices.map(c=>`<label><input type="checkbox" name="subObject" value="${esc(c.id)}" checked><span>${esc(c.name)}<small>${c.id==='rucksack'?'Fächer, Modultaschen und Material':c.id==='amp'?'Medikamente und zusätzliches Material':'Unterobjekt'}</small></span></label>`).join('')}</fieldset><p id="selectionError" class="danger hidden" role="alert">Bitte mindestens ein Prüfobjekt auswählen.</p>`:`<p><strong>${esc(root?.name||'Kontrollobjekt')}</strong></p>`;openDialog(`<h2>Neuen Check starten</h2><form id="startForm">${choiceHtml}<label>Name der prüfenden Person<input id="newName" autocomplete="name" required maxlength="120"></label><div class="row space"><button class="primary" type="submit">Check beginnen</button><button type="button" onclick="dlg.close()">Abbrechen</button></div></form>`);document.getElementById('startForm').onsubmit=e=>{e.preventDefault();const selected=choices.length?[...document.querySelectorAll('input[name="subObject"]:checked')].map(x=>x.value):[];if(choices.length&&!selected.length){document.getElementById('selectionError').classList.remove('hidden');return}const name=document.getElementById('newName').value.trim();if(!name)return;const legacyScope=rootId==='san-rucksack-kv'?'san':rootId==='aa-nef'?(selected.length===1&&selected[0]==='amp'?'amp':selected.length===1&&selected[0]==='rucksack'?'bag':'all'):'root';const s={id:globalThis.crypto?.randomUUID?.()||'s'+Date.now(),started:now(),name,secondName:'',rootId,selectedIds:selected,scope:legacyScope,entries:{},strokes:[],signedAt:null,finished:null,catalogVersion:DATA.version};db.sessions.unshift(s);db.active=s.id;const first=GROUPS.find(inScope);if(!first){alert('Für dieses Kontrollobjekt sind noch keine Prüfpunkte hinterlegt.');db.sessions.shift();db.active=null;return}groupId=first.id;mode='check';query='';filter='all';screen='check';save();dlg.close();render()}}
function resume(id){db.active=id;const s=session(),first=GROUPS.find(inScope);groupId=first?first.id:GROUPS[0].id;screen=s.finished||s.cancelled?'report':'check';mode='check';query='';filter='all';save();render()}
function chooseGroup(id){if(!GROUPS.some(g=>g.id===id&&inScope(g)))return;groupId=id;query='';filter='all';renderCheck();window.scrollTo(0,0)}
function setMode(m){mode=m;screen='check';render()}
function navigateReport(){screen='report';render();window.scrollTo(0,0)}
function renderCheck(){const s=session();if(!s){home();return}if(s.finished||s.cancelled){navigateReport();return}const st=stats(),g=GROUPS.find(x=>x.id===groupId);let nav='';let prev=null;for(const x of GROUPS.filter(inScope)){let heading=NODES[x.parent].name;if(heading!==prev){nav+=`<div class="navheading">${esc(heading)}</div>`;prev=heading}const n=x.items.filter(i=>entry(i.id).status!==null).length;nav+=`<button class="navbutton ${x.id===groupId?'active':''}" style="--color:${x.color}" onclick="chooseGroup('${x.id}')"><span>${esc(x.name)}</span><small>${n}/${x.items.length}</small></button>`}app.innerHTML=`<div class="toolbar"><div><div class="path">${esc(NODES[sessionRoot(s)]?.name||"Kontrollobjekt")}${scopeLabel(s)!==(NODES[sessionRoot(s)]?.name||"")?" / "+esc(scopeLabel(s)):""}</div><h1 style="margin-bottom:4px">${mode==='check'?'Materialcheck':'Bestand während Dienst'}</h1><small data-saved>Lokal gespeichert · ${esc(s.name)} · ${fmt(s.started)}</small></div><div class="tabs"><button class="${mode==='check'?'active':''}" onclick="setMode('check')">Dienstbeginn</button><button class="${mode==='use'?'active':''}" onclick="setMode('use')">Verbrauch / Nachfüllung</button><button onclick="navigateReport()">Bericht →</button></div></div><div class="layout"><aside class="sidebar"><div class="overview"><strong id="progressText">${st.done} / ${st.total} geprüft</strong><progress id="progress" value="${st.done}" max="${st.total}"></progress><small id="progressMeta">${st.missing} mit Fehlbestand · ${st.defects} mit Mangel · ${st.used} mit Verbrauch</small></div>${nav}</aside><section><select class="mobile-nav" aria-label="Fach auswählen" onchange="chooseGroup(this.value)">${GROUPS.filter(inScope).map(x=>`<option value="${x.id}" ${x.id===groupId?'selected':''}>${esc(groupLabel(x))}</option>`).join('')}</select><div class="card grouphead" style="--color:${g.color}"><div class="path">${esc(path(g))}</div><h2>${esc(g.name)}</h2><p class="muted" style="margin-bottom:8px">${mode==='check'?'✓ bestätigt den Sollbestand. X markiert vollständig fehlend. −1 erhöht die Fehlmenge um eins.':'− erfasst Verbrauch/Entnahme, + eine Nachfüllung. Der rechnerische Bestand kann den Sollbestand nicht überschreiten.'}</p></div><div class="search"><input id="search" type="search" placeholder="Material im gesamten Prüfobjekt suchen …" aria-label="Material suchen" value="${esc(query)}"><select id="filter" aria-label="Positionen filtern"><option value="all">Alle Positionen</option><option value="open">Noch ungeprüft</option><option value="missing">Fehlbestand / Mängel</option></select></div><div id="items"></div>${GROUPS.filter(inScope).at(-1).id===groupId?`<section class="card space"><label>Allgemeine Bemerkung<textarea id="generalNote" rows="3" maxlength="6000" placeholder="Bemerkung zum gesamten Check" oninput="setGeneralNote(this.value)">${esc(s.generalNote||'')}</textarea></label></section>`:''}<div class="endnav"><button ${GROUPS.filter(inScope)[0].id===groupId?'disabled':''} onclick="nextGroup(-1)">← Voriges Fach</button><button class="primary" ${GROUPS.filter(inScope).at(-1).id===groupId?'disabled':''} onclick="nextGroup(1)">Nächstes Fach →</button></div><p class="footer">Verbrauch und Nachfüllung werden je Position geführt. Daten werden nach jeder Änderung lokal gespeichert.</p></section></div>`;document.getElementById('filter').value=filter;document.getElementById('filter').onchange=e=>{filter=e.target.value;renderItems()};document.getElementById('search').oninput=e=>{query=e.target.value;renderItems()};renderItems()}
function nextGroup(d){const gs=GROUPS.filter(inScope),i=gs.findIndex(g=>g.id===groupId),next=gs[i+d];if(next)chooseGroup(next.id);}
function itemHTML(i){const e=entry(i.id),unknown=i.qty===null,current=currentStock(i,e),canRefill=!unknown&&current<i.qty;return `<article class="card item ${e.defect?'defective ':''}${unknown?'unclear':e.status?(e.missing?'missing':'checked'):''}" id="item-${i.id}">${query?`<div class="path">${esc(path(i.group))}</div>`:''}<div class="itemhead"><div><div class="itemtitle">${esc(i.ingredient?i.ingredient+' · '+i.strength:i.name)}</div>${i.ingredient?`<div class="sub">${esc(i.brand)} · ${esc(i.form)}</div>`:''}</div><span class="target"><span>SOLLBESTAND</span><strong>${unknown?'offen':i.qty}</strong></span></div>${i.note?`<div class="warning">${esc(i.note)}</div>`:''}${mode==='check'?`<div class="controls"><button class="success" ${unknown?'disabled':''} aria-label="${esc(i.name)} vollständig" onclick="change('${i.id}','ok')">✓ <span>Vollständig</span></button><button class="danger" aria-label="${esc(i.name)} vollständig fehlend" onclick="change('${i.id}','absent')">X <span>Fehlt</span></button><button aria-label="Fehlmenge um eins erhöhen" onclick="change('${i.id}','plus')">−1</button><label><span>Fehlt</span><input aria-label="Fehlmenge ${esc(i.name)}" type="number" inputmode="numeric" min="0" ${unknown?'':'max="'+i.qty+'"'} step="1" value="${unknown&&e.status===null?'':e.missing}" onchange="quantity('${i.id}','missing',this)"></label><button class="defect ${e.defect?'active':''}" aria-pressed="${e.defect}" onclick="change('${i.id}','defect')" aria-label="Mangel bei ${esc(i.name)}">⚠ <span>Mangel</span></button><button aria-label="Prüfung zurücksetzen" onclick="change('${i.id}','reset')">↺</button></div><div class="status" id="status-${i.id}">${statusText(i,e)}${e.defect?' · ⚠ Mangel':''}</div><details class="note" ${e.defect&&!e.checkNote?'open':''}><summary>Bemerkung bei Dienstbeginn${e.checkNote?' •':' hinzufügen'}</summary><label>Bemerkung bei Dienstbeginn<textarea rows="1" maxlength="3000" placeholder="Optional, z. B. Verpackung beschädigt" oninput="note('${i.id}','checkNote',this.value)">${esc(e.checkNote)}</textarea></label></details>`:`<div class="controls"><button class="danger" ${unknown||current<=0?'disabled':''} onclick="change('${i.id}','consume')" aria-label="Verbrauch um eins erhöhen">− <span>Verbrauch</span></button><label><span>Verbrauch</span><input aria-label="Verbrauch ${esc(i.name)}" type="number" inputmode="numeric" min="0" step="1" value="${e.used}" onchange="quantity('${i.id}','used',this)"></label><label><span>Nachgefüllt</span><input aria-label="Nachfüllung ${esc(i.name)}" type="number" inputmode="numeric" min="0" step="1" value="${e.refilled}" onchange="quantity('${i.id}','refilled',this)"></label><button class="success" ${!canRefill?'disabled':''} onclick="change('${i.id}','refill')" aria-label="Nachfüllung um eins erhöhen">+ <span>Nachfüllen</span></button></div><div class="status">${unknown?'Sollbestand unbekannt – Bestandsänderung nicht möglich.':'Bestand: '+current+' / '+i.qty} · Verbrauch: ${e.used} · Nachgefüllt: ${e.refilled}<br>Dienstbeginn: ${statusText(i,e)}${e.defect?' · ⚠ Mangel':''}</div><details class="note"><summary>Bemerkung während des Dienstes${e.useNote?' •':' hinzufügen'}</summary><label>Bemerkung während des Dienstes<textarea rows="1" maxlength="3000" placeholder="Optional, z. B. Entnahme oder Nachfüllung" oninput="note('${i.id}','useNote',this.value)">${esc(e.useNote)}</textarea></label></details>`}</article>`}
function statusText(i,e){if(e.status===null)return 'Noch ungeprüft';if(e.status==='absent')return i.qty===null?'Vollständig fehlend · Stückzahl zu klären':'Vollständig fehlend · '+e.missing+' fehlen';if(i.qty===null)return e.missing+' als Fehlmenge erfasst · Soll zu klären';return e.missing?e.missing+' von '+i.qty+' fehlen':'✓ Vollständig'}
function renderItems(){const q=query.toLocaleLowerCase('de'),items=scoped().filter(i=>(q?(i.name+' '+(i.ingredient||'')+' '+path(i.group)).toLocaleLowerCase('de').includes(q):i.group.id===groupId)).filter(i=>{const e=entry(i.id);return filter==='all'||filter==='open'&&e.status===null||filter==='missing'&&(finalMissing(i,e)>0||e.status==='absent'||e.defect)||filter==='unclear'&&i.note});document.getElementById('items').innerHTML=items.length?items.map(itemHTML).join(''):'<div class="card empty">Keine passenden Positionen.</div>'}
function invalidateSignature(){const s=session();if(s.strokes.length){s.strokes=[];s.signedAt=null}}
function updateProgress(){const st=stats();document.getElementById('progressText').textContent=st.done+' / '+st.total+' geprüft';document.getElementById('progress').value=st.done;document.getElementById('progressMeta').textContent=st.missing+' mit Fehlbestand · '+st.defects+' mit Mangel · '+st.used+' mit Verbrauch';document.querySelectorAll('.navbutton').forEach((b,j)=>{const g=GROUPS.filter(inScope)[j];b.querySelector('small').textContent=g.items.filter(i=>entry(i.id).status!==null).length+'/'+g.items.length})}
function changed(id){invalidateSignature();save();const el=document.getElementById('item-'+id);if(el)el.outerHTML=itemHTML(BYID[id]);updateProgress()}
function currentStock(i,e=entry(i.id)){return i.qty===null?null:Math.max(0,i.qty-e.missing-e.used+e.refilled)}
function finalMissing(i,e=entry(i.id)){return i.qty===null?(e.status==='absent'?null:0):Math.max(0,i.qty-currentStock(i,e))}
function commitQuantity(id,next){const i=BYID[id];if(i.qty===null&&(next.used>0||next.refilled>0)){openDialog('<h2>Bestand unbekannt</h2><p>Ohne festgelegten Sollbestand kann keine Bestandsänderung erfasst werden.</p><button onclick="dlg.close()">Verstanden</button>');return false}if(i.qty!==null){const stock=i.qty-next.missing-next.used+next.refilled;if(stock<0){openDialog('<h2>Menge nicht möglich</h2><p>Der rechnerische Bestand darf nicht unter 0 fallen.</p><button onclick="dlg.close()">Verstanden</button>');return false}if(stock>i.qty){openDialog('<h2>Nachfüllung nicht möglich</h2><p>Der rechnerische Bestand darf den Sollbestand von '+i.qty+' nicht überschreiten.</p><button onclick="dlg.close()">Verstanden</button>');return false}}Object.assign(entry(id),next);changed(id);return true}
function change(id,action){if(session().finished||session().cancelled)return;const e=entry(id),i=BYID[id],next={...e};if(action==='ok'&&i.qty!==null){next.status='ok';next.missing=0}if(action==='absent'){next.status='absent';next.missing=i.qty??0}if(action==='plus'){next.missing=Math.min(i.qty??Number.MAX_SAFE_INTEGER,e.missing+1);next.status='partial'}if(action==='reset'){next.status=null;next.missing=0}if(action==='defect')next.defect=!e.defect;if(action==='consume')next.used=e.used+1;if(action==='refill')next.refilled=e.refilled+1;commitQuantity(id,next)}
function quantity(id,key,input){if(session().finished||session().cancelled)return;const n=Number(input.value),i=BYID[id],e=entry(id);if(input.value===''||!Number.isSafeInteger(n)||n<0||(key==='missing'&&i.qty!==null&&n>i.qty)){input.value=e[key];openDialog('<h2>Ungültige Menge</h2><p>Bitte eine ganze, nicht negative Zahl innerhalb des zulässigen Bestands eingeben.</p><button onclick="dlg.close()">Verstanden</button>');return}const next={...e,[key]:n};if(key==='missing')next.status=n===0&&i.qty!==null?'ok':'partial';if(!commitQuantity(id,next))input.value=e[key]}
function note(id,key,value){if(session().finished||session().cancelled)return;entry(id)[key]=value;invalidateSignature();save()}
let canvas=null,ctx=null,drawing=false,stroke=null;
function drawLines(c,lines,w,h){c.clearRect(0,0,w,h);c.strokeStyle='#153747';c.lineWidth=2.3;c.lineCap='round';c.lineJoin='round';for(const a of lines){if(!a.length)continue;c.beginPath();c.moveTo(a[0][0]*w,a[0][1]*h);for(const p of a.slice(1))c.lineTo(p[0]*w,p[1]*h);if(a.length===1)c.lineTo(a[0][0]*w+.2,a[0][1]*h+.2);c.stroke()}}
function drawSignature(){if(!canvas||!canvas.isConnected)return;const r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);drawLines(ctx,session().strokes,r.width,r.height)}
function signatureURL(){const c=document.createElement('canvas');c.width=1000;c.height=300;drawLines(c.getContext('2d'),session().strokes,1000,300);return c.toDataURL('image/png')}
function initSignature(){canvas=document.getElementById('signature');drawSignature();const point=e=>{const r=canvas.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};canvas.onpointerdown=e=>{if(drawing)return;e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);stroke=[point(e)];session().strokes.push(stroke);drawSignature()};canvas.onpointermove=e=>{if(!drawing)return;e.preventDefault();stroke.push(point(e));drawSignature()};const end=e=>{if(!drawing)return;drawing=false;session().signedAt=now();save();updateSignatureImage()};canvas.onpointerup=end;canvas.onpointercancel=end;canvas.onlostpointercapture=end}
window.addEventListener('resize',()=>{if(screen==='report')drawSignature()});
function clearSignature(){session().strokes=[];session().signedAt=null;save();drawSignature();updateSignatureImage()}
function reopen(){openDialog('<h2>Check wieder öffnen?</h2><p>Die bisherige Unterschrift wird entfernt, damit der geänderte Bericht neu unterschrieben werden kann. Speichere bei Bedarf zuerst den bestehenden Bericht.</p><div class="row"><button class="primary" onclick="session().finished=null;clearSignature();save();dlg.close();screen=\'check\';render()">Wieder öffnen</button><button onclick="dlg.close()">Abbrechen</button></div>')}
function download(content,name,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function downloadBackup(){download(JSON.stringify(db,null,2),'AA-NEF-Sicherung-'+new Date().toISOString().slice(0,10)+'.json','application/json')}
async function downloadReport(){renderReport();updateSignatureImage();const clone=app.querySelector('.report').cloneNode(true);clone.querySelectorAll('.no-print').forEach(x=>x.remove());clone.querySelectorAll('.print-only').forEach(x=>x.classList.remove('print-only'));const content='<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AA-NEF Materialcheck Bericht</title><style>'+document.querySelector('style').textContent+'</style><body><main class="wrap">'+clone.outerHTML+'</main></body></html>',name='AA-NEF-Bericht-'+new Date(session().started).toISOString().slice(0,10)+'.html',file=new File([content],name,{type:'text/html'});const apple=/Mac|iPhone|iPad|iPod/.test(navigator.platform)||navigator.userAgent.includes('Mac OS X');if(apple&&navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share({files:[file],title:'AA-NEF Materialcheck Bericht'});return}catch(err){if(err?.name==='AbortError')return}}download(content,name,'text/html')}
document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>20000000)throw Error();const imported=JSON.parse(await file.text());if(!validDB(imported))throw Error();window.pendingImport=imported;openDialog(`<h2>Sicherung einlesen</h2><p>${imported.sessions.length} Checks wurden erkannt. Vorhandene Checks bleiben erhalten. Checks mit gleicher ID werden durch die Sicherung ersetzt.</p><div class="row"><button class="primary" onclick="applyImport()">Einlesen</button><button onclick="dlg.close();window.pendingImport=null">Abbrechen</button></div>`)}catch(err){openDialog('<h2>Ungültige Sicherung</h2><p>Die Datei ist keine passende Materialcheck-Sicherung. Es wurden keine Daten verändert.</p><button onclick="dlg.close()">Schließen</button>')}e.target.value=''};
function applyImport(){const d=window.pendingImport;upgradeOpenChecks(d);const map=new Map(db.sessions.map(s=>[s.id,s]));d.sessions.forEach(s=>map.set(s.id,s));db.sessions=[...map.values()];if(d.active)db.active=d.active;save();window.pendingImport=null;dlg.close();home()}
function help(){openDialog('<h2>Offline & Datensicherung</h2><p>Diese HTML-Datei enthält die gesamte App und Materialliste. Sie benötigt nach dem Öffnen keine Internetverbindung.</p><p>Checks werden nur in diesem Browser gespeichert. Privater Modus, gelöschte Browserdaten oder ein anderer Dateipfad können den Zugriff auf gespeicherte Checks verhindern. Die App meldet Speicherfehler sichtbar.</p><p>Über „Sicherung“ lassen sich alle Checks samt Unterschriften herunterladen und später wieder einlesen. „Bericht speichern“ speichert einen eigenständigen HTML-Bericht ohne Druckansicht. Auf Apple-Geräten wird – sofern unterstützt – der Teilen-/Dateien-Dialog verwendet. „Drucken / PDF“ öffnet separat den Druckdialog.</p><p><strong>iPad:</strong> Eine HTML-Vorschau in der Dateien-App führt JavaScript möglicherweise nicht aus. Die Datei muss in einem Browser bzw. einer HTML-App mit JavaScript-Unterstützung geöffnet werden. Eine direkte Installation als Safari-Home-Bildschirm-App aus einer lokalen Datei ist nicht enthalten.</p><button onclick="dlg.close()">Verstanden</button>')}
document.getElementById('homeButton').onclick=home;
window.addEventListener('beforeprint',()=>{if(session()){screen='report';renderReport()}updateSignatureImage()});
window.addEventListener('storage',e=>{if(e.key===KEY)storageFail('Dieser Check wurde in einem anderen Fenster geändert. Bitte diese Seite nach einer Sicherung neu laden, um Überschreiben zu vermeiden.')});
function updateHeader(){const s=session(),active=screen!=='home'&&s&&!s.finished&&!s.cancelled;document.getElementById('finishButton').classList.toggle('hidden',!active);document.getElementById('cancelButton').classList.toggle('hidden',!active)}
function render(){if(screen==='home')renderHome();else if(screen==='report')renderReport();else renderCheck();updateHeader()}
function renderHome(){const s=session();app.innerHTML=`<div class="home"><section class="card"><h1>Sanitätsdienst Materialcheck</h1><label>Zu Kontrollieren<select id="vehicleSelect" style="display:block;width:100%;margin-top:6px">${DATA.containers.filter(c=>c.parent===null).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label><div class="row space"><button class="primary" onclick="startForm()">Neuen Check starten</button>${s&&!s.finished&&!s.cancelled?`<button onclick="resume('${esc(s.id)}')">Begonnenen Check fortsetzen →</button>`:''}</div></section><section class="card space"><h2>Checks & Berichte</h2>${db.sessions.length?db.sessions.map(s=>`<div class="archive"><div><strong>${esc(NODES[sessionRoot(s)]?.name||'Kontrollobjekt')} · ${esc(s.name)}</strong><br><small>${fmt(s.started)} · ${scopeLabel(s)} · ${s.cancelled?'Abgebrochen':s.finished?'Abgeschlossen':'In Bearbeitung'}</small></div><div class="row"><button onclick="resume('${esc(s.id)}')">Öffnen →</button>${!s.finished&&!s.cancelled?`<button class="danger" onclick="cancelCheck('${esc(s.id)}')">Abbrechen</button>`:''}<button class="danger" onclick="deleteCheck('${esc(s.id)}')">Löschen</button></div></div>`).join(''):'<p class="muted">Noch keine Checks.</p>'}<div class="row space"><button onclick="downloadBackup()">Sicherung herunterladen</button><button onclick="document.getElementById('importFile').click()">Sicherung einlesen</button></div></section></div>`;updateHeader()}
function table(items){if(!items.length)return '<p class="muted">Keine Einträge.</p>';let last='';return `<table class="compact"><colgroup><col style="width:40%"><col style="width:8%"><col style="width:15%"><col style="width:37%"></colgroup><thead><tr><th>Material</th><th>Soll</th><th>Status</th><th>Fehlbestand</th></tr></thead><tbody>${items.map(i=>{const e=entry(i.id);let h='';if(last!==i.group.id){last=i.group.id;h=`<tr class="group-row"><th colspan="4">${esc(groupLabel(i.group))}</th></tr>`}const fm=finalMissing(i,e),amount=fm===null?'offen':e.status===null&&!e.used&&!e.refilled?'?':fm;const detail=i.qty===null?'Soll offen':`Beginn ${e.missing} + Verbrauch ${e.used} − Nachfüllung ${e.refilled}`;const notes=[e.defect?'⚠ Mangel':'',e.checkNote?'Bemerkung bei Dienstbeginn: '+e.checkNote:'',e.useNote?'Bemerkung während des Dienstes: '+e.useNote:''].filter(Boolean).join(' · ');const status=e.status===null?'Ungeprüft':(e.defect?'⚠ Mangel':i.qty===null?'Erfasst':'✓');const main=`<tr class="material-row${notes?' has-note':''}" data-item="${i.id}"><td>${esc(i.ingredient?i.ingredient+' '+i.strength+' ('+i.brand+')':i.name)}</td><td>${i.qty??'?'}</td><td>${status}</td><td><strong>${amount}</strong> <span class="breakdown">(${detail})</span></td></tr>`;const note=notes?`<tr class="note-row"><td colspan="4"><span class="note-label">Bemerkung:</span> <span class="note-text">${esc(notes)}</span></td></tr>`:'';return h+main+note}).join('')}</tbody></table>`}
function renderReport(){const s=session();if(!s){home();return}const all=scoped(),st=stats(),needed=all.filter(i=>{const e=entry(i.id);return finalMissing(i,e)>0||e.status==='absent'||e.defect}),remaining=all.filter(i=>!needed.includes(i)),locked=s.finished||s.cancelled;app.innerHTML=`<section class="card report"><div class="row no-print" style="justify-content:space-between;margin-bottom:18px"><button id="reportBack">${s.cancelled?'← Übersicht':s.finished?'Check wieder öffnen':'← Zur Materialliste'}</button><div class="row"><button onclick="downloadReport()">Bericht speichern</button><button class="primary" onclick="window.print()">Drucken / PDF</button></div></div><h1>${s.cancelled?'Abgebrochener Check':s.finished?'Abschlussbericht':'Berichtsentwurf'}</h1><p>AA-NEF · ${scopeLabel(s)}</p><div class="report-meta"><div><strong>Beginn:</strong> ${fmt(s.started)}</div><div><strong>${s.cancelled?'Abgebrochen':s.finished?'Abschluss':'Stand'}:</strong> ${fmt(s.cancelled||s.finished||now())}</div><div><strong>Name:</strong> ${esc(s.name)}</div><div><strong>Weitere Person:</strong> ${esc(s.secondName)||'–'}</div></div><p class="space">${st.done} / ${st.total} geprüft · ${st.total-st.done} ungeprüft</p><h2>Fehlbestand / Mängel</h2>${table(needed)}${s.generalNote?`<section class="general-report-note"><h2>Allgemeine Bemerkung</h2><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(s.generalNote)}</p></section>`:''}<h2>Weitere Positionen</h2>${table(remaining)}<div class="signblock" id="signblock"><h2>Unterschrift</h2>${locked?`<p>${esc(s.name)}${s.secondName?' · '+esc(s.secondName):''}</p>`:`<div class="split no-print"><label>Prüfende Person<input id="reportName" maxlength="120" value="${esc(s.name)}"></label><label>Weitere Person (optional)<input id="secondName" maxlength="120" value="${esc(s.secondName)}"></label></div>`}<p id="signedTime" class="muted">${s.signedAt?'Unterzeichnet am '+fmt(s.signedAt):'Noch nicht unterschrieben.'}</p>${!locked?'<div class="no-print"><canvas id="signature" class="signature" aria-label="Unterschriftenfeld"></canvas><button class="space" onclick="clearSignature()">Unterschrift löschen</button></div>':''}<img id="signatureImage" class="signimage ${locked?'':'print-only'}" alt="${s.strokes.length?'Unterschrift':'Keine Unterschrift vorhanden'}"><p class="print-only">${esc(s.name)}</p>${!locked?'<div class="row space no-print"><button class="primary" onclick="finish()">Abschluss bestätigen …</button></div>':''}</div><small class="space" style="display:block">Check-ID: ${esc(s.id)}</small><div class="row space no-print"><button onclick="downloadBackup()">Sicherung herunterladen</button><button onclick="document.getElementById('importFile').click()">Sicherung einlesen</button></div></section>`;document.getElementById('reportBack').onclick=()=>{if(s.cancelled)home();else if(s.finished)reopen();else{screen='check';render()}};if(!locked){for(const key of ['name','secondName']){document.getElementById(key==='name'?'reportName':'secondName').oninput=e=>{s[key]=e.target.value;invalidateSignature();save();drawSignature();updateSignatureImage()}}initSignature()}updateSignatureImage();updateHeader()}
function finish(){const s=session();if(!s||s.finished||s.cancelled)return;if(!s.name.trim()||!s.strokes.some(a=>a.length>1)){document.getElementById('signblock').scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('signedTime').textContent='Bitte Namen und Unterschrift ergänzen.';return}const st=stats();openDialog(`<h2>Check abschließen?</h2><p>${st.done} / ${st.total} geprüft${st.total-st.done?' · '+(st.total-st.done)+' noch ungeprüft':''}.</p><div class="row"><button class="primary" onclick="session().finished=now();save();dlg.close();renderReport();window.scrollTo(0,0)">Abschluss bestätigen</button><button onclick="dlg.close()">Zurück</button></div>`)}
function openFinish(){if(!session()||session().finished||session().cancelled)return;if(screen!=='report'){screen='report';renderReport()}finish()}
function cancelCheck(id){const target=id||db.active,s=db.sessions.find(x=>x.id===target);if(!s||s.finished||s.cancelled)return;openDialog(`<h2>Check abbrechen?</h2><p>Der Check von ${esc(s.name)} wird als abgebrochen im Verlauf gespeichert.</p><div class="row"><button class="danger" id="confirmCancel">Check abbrechen</button><button onclick="dlg.close()">Weiter prüfen</button></div>`);document.getElementById('confirmCancel').onclick=()=>{s.cancelled=now();s.strokes=[];s.signedAt=null;save();dlg.close();home()}}
function updateSignatureImage(){const time=document.getElementById('signedTime');if(time)time.textContent=session().signedAt?'Unterzeichnet am '+fmt(session().signedAt):'Noch nicht unterschrieben.';const el=document.getElementById('signatureImage');if(el){if(session().strokes.length){el.src=signatureURL();el.alt='Unterschrift von '+session().name}else{el.removeAttribute('src');el.alt='Keine Unterschrift vorhanden'}}}
// Preserve the original target in existing records; the confirmed target applies to new checks.
function effectiveItem(i){return i}
function scoped(){return ITEMS.filter(i=>inScope(i.group)).map(effectiveItem)}

function upgradeOpenChecks(data){for(const s of data.sessions){if(!s.finished&&!s.cancelled&&s.catalogVersion!==2){const item=ITEMS.find(i=>i.userOverride),e=s.entries[item.id];if(e?.status==='absent'&&e.missing===0)e.missing=2;if(e?.status){s.strokes=[];s.signedAt=null}s.catalogVersion=2}}}
upgradeOpenChecks(db);
function deleteCheck(id){const target=db.sessions.find(s=>s.id===id);if(!target)return;openDialog(`<h2>Check endgültig löschen?</h2><p><strong>${esc(target.name)}</strong> · ${fmt(target.started)}<br>${esc(scopeLabel(target))}</p><p>Alle Einträge, Verbrauchsmengen und die Unterschrift dieses Checks werden entfernt. Das lässt sich nicht rückgängig machen.</p><div class="row"><button class="danger" id="confirmDelete">Endgültig löschen</button><button onclick="dlg.close()">Behalten</button></div>`);document.getElementById('confirmDelete').onclick=()=>{db.sessions=db.sessions.filter(s=>s.id!==id);if(db.active===id)db.active=db.sessions[0]?.id||null;save();dlg.close();home()}}
function setGeneralNote(value){const s=session();if(!s||s.finished||s.cancelled)return;s.generalNote=value;invalidateSignature();save();if(screen==='report'){drawSignature();updateSignatureImage()}}
render();
</script></body></html>
